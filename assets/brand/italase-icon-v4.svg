<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#227D48"/>
      <stop offset="55%" stop-color="#1D6B3C"/>
      <stop offset="100%" stop-color="#0E3D20"/>
    </radialGradient>
    <linearGradient id="roof" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CE"/>
      <stop offset="52%" stop-color="#F6BE5C"/>
      <stop offset="100%" stop-color="#DF8A0A"/>
    </linearGradient>
    <filter id="under" x="-40%" y="-220%" width="180%" height="540%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- one contact shadow: the stall sits on the ground -->
  <ellipse cx="256" cy="394" rx="112" ry="14" fill="#04170B" opacity="0.55" filter="url(#under)"/>

  <!-- ============ WARUNG BODY (solid, clearly lighter than the background) ============ -->
  <rect x="154" y="268" width="204" height="126" rx="10" fill="#2C8050"/>
  <rect x="154" y="268" width="204" height="126" rx="10" fill="none"
        stroke="#0B3219" stroke-opacity="0.55" stroke-width="3"/>

  <!-- open display recess: dark interior where the stock sits -->
  <rect x="172" y="284" width="168" height="72" rx="8" fill="#0A2A14"/>

  <!-- stock: three different silhouettes so it never reads as a bar chart -->
  <!-- jar: squat body with a wide lid -->
  <rect x="188" y="314" width="34" height="36" rx="7" fill="#E8930C"/>
  <rect x="186" y="302" width="38" height="14" rx="6" fill="#FDEBC8"/>
  <!-- bottle: narrow neck on a wider body -->
  <rect x="238" y="320" width="28" height="30" rx="6" fill="#FAF6EE"/>
  <rect x="248" y="304" width="9" height="18" rx="3" fill="#FAF6EE"/>
  <rect x="245" y="300" width="15" height="7" rx="3.5" fill="#E8930C"/>
  <!-- box: plain carton, sits lower than the jar -->
  <rect x="288" y="312" width="32" height="38" rx="5" fill="#FDEBC8"/>
  <rect x="288" y="324" width="32" height="5" fill="#DF8A0A" opacity="0.85"/>

  <!-- ledge lip the stock stands on -->
  <rect x="168" y="348" width="176" height="10" rx="5" fill="#F3EDDE" opacity="0.85"/>

  <!-- stall base -->
  <rect x="154" y="360" width="204" height="34" rx="10" fill="#1F5C39"/>

  <!-- ============ AWNING ============ -->
  <rect x="128" y="238" width="256" height="26" rx="9" fill="#B26A05"/>
  <rect x="128" y="238" width="256" height="26" rx="9" fill="none"
        stroke="#FDEBC8" stroke-opacity="0.30" stroke-width="2"/>

  <!-- valance, closed at both ends so nothing dangles loose -->
  <path d="M132 262 H380 v8 q-20 18 -41 0 q-21 18 -41 0 q-20 18 -41 0 q-21 18 -41 0 q-20 18 -40 0 q-21 18 -44 0 Z"
        fill="#E8930C"/>
  <path d="M132 262 H380" stroke="#FDEBC8" stroke-opacity="0.34" stroke-width="3"/>

  <!-- ============ ROOF ============ -->
  <path d="M256 112 L418 232 Q424 244 410 244 H102 Q88 244 94 232 Z" fill="url(#roof)"/>
  <path d="M256 112 L418 232 Q424 244 410 244 H256 Z" fill="#000000" opacity="0.09"/>
  <path d="M256 118 L256 242" stroke="#FFF0CE" stroke-opacity="0.55" stroke-width="8"
        stroke-linecap="round"/>
  <path d="M256 118 L256 242" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"
        stroke-linecap="round"/>
</svg>
